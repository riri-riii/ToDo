<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ガントチャート</title>
  <link rel="stylesheet" href="./src/styles/gantt.css" />
  <style>
    :root{--border:#e5e7eb;--text:#111827;--muted:#6b7280;--bg:#fff;--primary:#2563eb;--primary-600:#1d4ed8;--shadow:0 1px 2px rgba(0,0,0,.06);--radius:10px;}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;}
    #topbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);position:relative;z-index:10;}
    .btn{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;cursor:pointer;box-shadow:var(--shadow);}
    .btn-primary{background:var(--primary);border-color:var(--primary-600);color:#fff;}
    #menuContainer{margin-left:auto;position:relative;}
    #menuBtn{width:36px;padding:0;font-size:18px;}
    .dropdown{display:none;position:absolute;right:0;top:42px;min-width:220px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;}
    .dropdown.open{display:block;}
    .dropdown button{width:100%;padding:9px 10px;text-align:left;background:transparent;border:0;border-radius:8px;cursor:pointer;}
    .dropdown button:hover{background:#f3f4f6;}
    #gantt-container{overflow:auto;width:100%;height:calc(100vh - 58px);}
  </style>
  <link rel="icon" type="image/png" href="src/riri_riii_Todo.png" sizes="32x32">
</head>
<body>
  <div id="topbar">
    <button id="toList" class="btn" type="button">タスク一覧</button>
    <button id="toCreate" class="btn btn-primary" type="button">新規タスク</button>

    <span id="menuContainer">
      <button id="menuBtn" class="btn" type="button" aria-label="メニュー">≡</button>
      <div id="menuDropdown" class="dropdown" role="menu">
        <button id="menuIcs" role="menuitem">ics取り込み設定</button>
        <button id="menuLogout" role="menuitem">ログアウト</button>
      </div>
    </span>
  </div>

  <div id="gantt-container">
    <svg id="gantt"></svg>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
