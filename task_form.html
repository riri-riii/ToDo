<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タスク登録・編集</title>
  <style>
    :root{--border:#e5e7eb;--text:#111827;--muted:#6b7280;--bg:#f8fafc;--card:#fff;--primary:#2563eb;--danger:#dc2626;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;}
    .wrap{max-width:760px;margin:0 auto;padding:16px;}
    .topbar{display:flex;gap:8px;margin-bottom:12px;}
    .btn{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;}
    .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .btn-danger{background:#fff5f5;border-color:#fecaca;color:var(--danger);}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .full{grid-column:1 / -1;}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    input,select{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 10px;box-sizing:border-box;}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
    @media (max-width:640px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <button id="toGantt" class="btn" type="button">ガントチャート</button>
      <button id="toList" class="btn" type="button">タスク一覧</button>
    </div>

    <div class="card">
      <h2 id="formTitle">新規タスク</h2>
      <div class="grid">
        <div class="full">
          <label for="name">タスク名（必須）</label>
          <input id="name" type="text" required />
        </div>

        <div>
          <label for="plannedStart">予定開始日（必須）</label>
          <input id="plannedStart" type="date" required />
        </div>
        <div>
          <label for="plannedEnd">予定終了日（必須）</label>
          <input id="plannedEnd" type="date" required />
        </div>

        <div>
          <label for="progress">進捗（必須）</label>
          <select id="progress" required>
            <option value="0">0%</option>
            <option value="20">20%</option>
            <option value="40">40%</option>
            <option value="60">60%</option>
            <option value="80">80%</option>
            <option value="100">100%</option>
          </select>
        </div>
        <div></div>

        <div>
          <label for="actualStart">実開始日（任意）</label>
          <input id="actualStart" type="date" />
        </div>
        <div>
          <label for="actualEnd">実終了日（任意）</label>
          <input id="actualEnd" type="date" />
        </div>

        <div>
          <label for="plannedHours">予定工数（任意）</label>
          <input id="plannedHours" type="number" min="0" step="0.5" />
        </div>
        <div>
          <label for="actualHours">実工数（任意）</label>
          <input id="actualHours" type="number" min="0" step="0.5" />
        </div>
      </div>

      <div class="actions">
        <button id="deleteBtn" class="btn btn-danger" type="button" style="display:none;">削除</button>
        <button id="saveBtn" class="btn btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <script type="module" src="task_form.js"></script>
</body>
</html>
